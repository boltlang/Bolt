[package]
name = "boltlang-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "bolt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
ariadne = "0.6.0"
boltlang-base-db.workspace = true
boltlang-ide-diagnostics.workspace = true
boltlang-syntax.workspace = true
clap = { version = "4.5.56", features = ["cargo", "derive"] }
serde_json = "1.0.149"
