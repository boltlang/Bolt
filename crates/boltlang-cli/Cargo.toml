[package]
name = "boltlang-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bolt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
ariadne = "0.6.0"
boltlang-base-db = { version = "0.1.0", path = "../boltlang-base-db" }
boltlang-ide-diagnostics = { version = "0.1.0", path = "../boltlang-ide-diagnostics" }
boltlang-syntax = { version = "0.1.0", path = "../boltlang-syntax" }
clap = { version = "4.5.56", features = ["cargo", "derive"] }
serde_json = "1.0.149"
