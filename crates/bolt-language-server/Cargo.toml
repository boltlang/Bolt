[package]
name = "bolt-language-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
boltlang-base-db.workspace = true
boltlang-ide-diagnostics.workspace = true
boltlang-syntax.workspace = true
# The version tower-lsp-server uses, so that the types are the same.
ls-types = "0.0.2"

# The binary runs the server over stdio, which the browser doesn't have.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
boltlang-std.workspace = true
tokio = { version = "1.49.0", features = ["full"] }
tower-lsp-server = "0.23.0"
