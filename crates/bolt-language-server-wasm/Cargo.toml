[package]
name = "bolt-language-server-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# A cdylib for wasm-bindgen, and an rlib for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
bolt-language-server.workspace = true
boltlang-base-db.workspace = true
serde = "1.0.228"
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
