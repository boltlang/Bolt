<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bolt Playground</title>
    <link rel="stylesheet" href="style.css" />
    <!-- The compiled code imports web-tree-sitter by name, as in src/. -->
    <script type="importmap">
      { "imports": { "web-tree-sitter": "./vendor/web-tree-sitter.js" } }
    </script>
    <script type="module" src="dist/main.js"></script>
  </head>
  <body>
    <header>
      <h1>Bolt playground</h1>
      <span id="status" role="status">Loading tree-sitter…</span>
      <button id="reset" type="button" disabled>Reset</button>
    </header>
    <main>
      <div class="editor">
        <pre aria-hidden="true"><code id="highlighted"></code></pre>
        <pre aria-hidden="true" class="underlines"><code id="underlines"></code></pre>
        <textarea
          id="source"
          aria-label="Bolt code"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          disabled
        ></textarea>
      </div>
      <section id="problems" aria-label="Problems">
        <ul id="problem-list"></ul>
      </section>
    </main>
  </body>
</html>
