name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The same toolchain as the tests in rust.yml.
    - run: rustup update nightly && rustup default nightly && rustup component add llvm-tools-preview
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info
    # Uses the GITHUB_TOKEN, so the repository only has to be enabled on
    # coveralls.io.
    - name: Upload to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: lcov.info
