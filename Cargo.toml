[workspace]
resolver = "3"
members = [
  "crates/boltlang-common",
  "crates/boltlang-syntax",
  "crates/boltlang-parser",
  "crates/boltlang-base-db",
  "crates/boltlang-hir-def",
  "crates/boltlang-hir",
  "crates/boltlang-hir-ty",
  "crates/boltlang-pattern",
  "crates/boltlang-mir",
  "crates/boltlang-mir-build",
  "crates/boltlang-mir-mono",
  "crates/boltlang-mir-transform",
  "crates/boltlang-codegen-conduit",
  "crates/boltlang-corpus",
  "crates/boltlang-ide-diagnostics",
  "crates/boltlang-std",
  "crates/boltlang-cli",
  "crates/bolt-language-server",
  "crates/bolt-language-server-wasm",
]

# One version for all crates: they're parts of one compiler, released
# together. `bolt --version` and the language server report it.
[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

# The crates of the workspace, so that their version is only written here.
[workspace.dependencies]
bolt-language-server = { version = "0.2.0", path = "crates/bolt-language-server" }
boltlang-base-db = { version = "0.2.0", path = "crates/boltlang-base-db" }
boltlang-codegen-conduit = { version = "0.2.0", path = "crates/boltlang-codegen-conduit" }
boltlang-common = { version = "0.2.0", path = "crates/boltlang-common" }
boltlang-corpus = { version = "0.2.0", path = "crates/boltlang-corpus" }
boltlang-hir = { version = "0.2.0", path = "crates/boltlang-hir" }
boltlang-hir-def = { version = "0.2.0", path = "crates/boltlang-hir-def" }
boltlang-hir-ty = { version = "0.2.0", path = "crates/boltlang-hir-ty" }
boltlang-ide-diagnostics = { version = "0.2.0", path = "crates/boltlang-ide-diagnostics" }
boltlang-mir = { version = "0.2.0", path = "crates/boltlang-mir" }
boltlang-mir-transform = { version = "0.2.0", path = "crates/boltlang-mir-transform" }
boltlang-mir-build = { version = "0.2.0", path = "crates/boltlang-mir-build" }
boltlang-mir-mono = { version = "0.2.0", path = "crates/boltlang-mir-mono" }
boltlang-pattern = { version = "0.2.0", path = "crates/boltlang-pattern" }
boltlang-parser = { version = "0.2.0", path = "crates/boltlang-parser" }
boltlang-std = { version = "0.2.0", path = "crates/boltlang-std" }
boltlang-syntax = { version = "0.2.0", path = "crates/boltlang-syntax" }
